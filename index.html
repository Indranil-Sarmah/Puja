<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IT/Telecom Department welcomes you for Viswakarma Puja 2026">
  <meta name="theme-color" content="#3d0a0a">
  <title>Viswakarma Puja 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙏</text></svg>">
</head>
<body>
  <div class="design-backdrop" aria-hidden="true">
    <div class="design-backdrop__gradient"></div>
    <div class="design-bokeh">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <main>
    <section class="welcome">
      <div class="falling-decor" id="fallingDecor" aria-hidden="true"></div>
      <div class="welcome-content">
        <div class="welcome-hero-wrap" id="heroWrap">
          <video
            class="hero-design-video"
            id="heroDesignVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto"
          >
            <source src="assets/video/design.mp4" type="video/mp4">
          </video>
          <div class="hero-fallback" id="heroFallback">
            <div class="hero-chakri" aria-hidden="true">
              <div class="hero-chakri__glow"></div>
              <div class="hero-chakri__rays"></div>
              <div class="hero-chakri__ring"></div>
            </div>
            <img class="welcome-hero" src="assets/images/hero/image.png" alt="Viswakarma Puja">
            <div class="ritual-incense" id="ritualIncense" aria-hidden="true">
              <div class="incense-holder">
                <div class="incense-stick"></div>
                <div class="incense-smoke">
                  <span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <p class="welcome-message">IT / Telecom Department welcomes you for Viswakarma Puja</p>
      </div>
    </section>

    <div class="thrown-flowers" id="thrownFlowers" aria-hidden="true"></div>

    <section class="gallery-section">
      <h2 class="gallery-heading">Idol Making Process</h2>
      <div class="gallery-panel">
        <div class="gallery-scroll" id="galleryScroll"></div>
      </div>
      <div class="pushpanjali-area">
        <div class="pushpanjali-actions">
          <button type="button" class="mantra-toggle-btn is-playing" id="mantraToggleBtn" aria-label="Pause mantra" aria-pressed="true">
            <span class="mantra-toggle-btn__icon" aria-hidden="true">⏸</span>
          </button>
          <button type="button" class="pushpanjali-btn" id="pushpanjaliBtn">
            <span class="pushpanjali-btn__icon">🌸</span>
            <span class="pushpanjali-btn__text">Pushpanjali — Offer Flowers</span>
          </button>
        </div>
        <div class="ritual-diya" id="ritualDiya" aria-hidden="true">
          <div class="ritual-diya__figure">
            <div class="ritual-diya__glow"></div>
            <div class="ritual-diya__flame-wrap" aria-hidden="true">
              <span class="ritual-diya__flame"></span>
              <span class="ritual-diya__flame-core"></span>
            </div>
            <img src="assets/images/hero/diya.png" alt="Diya lamp">
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="image-slider" id="imageSlider" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Idol making progress gallery">
    <div class="image-slider__backdrop"></div>
    <div class="image-slider__dialog">
      <button type="button" class="image-slider__nav image-slider__nav--prev" id="sliderPrev" aria-label="Previous image">&lt;</button>
      <figure class="image-slider__figure">
        <img class="image-slider__img" id="sliderImg" src="" alt="">
        <figcaption class="image-slider__caption" id="sliderCaption"></figcaption>
      </figure>
      <button type="button" class="image-slider__nav image-slider__nav--next" id="sliderNext" aria-label="Next image">&gt;</button>
    </div>
  </div>

  <audio id="mantraAudio" autoplay muted loop playsinline preload="auto">
    <source src="assets/audio/mantra.mp3" type="audio/mpeg">
  </audio>

  <script src="assets/js/main.js"></script>
</body>
</html>
